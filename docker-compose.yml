services:
  # Container 1: the database
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Glms@Strong!Pass2026"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - glms-network

  # Container 2: the Web API (the only container that talks to the database)
  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    depends_on:
      - sql-server-db
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=GLMS_ApiDb;User Id=sa;Password=Glms@Strong!Pass2026;TrustServerCertificate=True;Connect Timeout=60"
    ports:
      - "5001:8080"
    volumes:
      - agreement-files:/app/AgreementFiles
    networks:
      - glms-network
    restart: on-failure

  # Container 3: the MVC front end (calls the API by its container name)
  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"
    ports:
      - "5000:8080"
    networks:
      - glms-network
    restart: on-failure

networks:
  glms-network:
    driver: bridge

volumes:
  sql-data:
  agreement-files: